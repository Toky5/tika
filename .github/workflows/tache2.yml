# Tâche 2 (IFT3913) : exécute tous les tests de tika-core (tests d'origine, tests générés
# par ChatUniTest et tests écrits à la main), puis mesure la couverture JaCoCo et lance PIT
# sur EndianUtils pour chacune des quatre suites de tests du README :
#   1. tests d'origine seulement ;
#   2. + tests générés par ChatUniTest (classes EndianUtils_*_Test) ;
#   3. + tests écrits à la main pour les mutants survivants (EndianUtilsMutationTest) ;
#   4. + tests écrits à la main pour le code non couvert (EndianUtilsCouvertureTest).
# Pour chaque suite, JaCoCo donne une ligne de couverture-jacoco.csv et un rapport HTML limité à
# EndianUtils (le rapport HTML de Maven couvre tout tika-core).
# PIT produit la matrice complète (fullMutationMatrix) : pour chaque mutant, la liste de tous
# les tests qui le tuent. Le résumé s'en sert pour compter, pour chaque test écrit à la main,
# les mutants qu'il est seul à tuer.
# L'artefact « tache2-rapports » contient les rapports, rangés comme dans le dossier tache2/
# du dépôt. ChatUniTest n'est pas relancé ici : il a besoin d'un LLM local (voir le README).

name: "Tâche 2 - tests et mutation (EndianUtils)"

on:
  push:
    branches: [ main ]
    paths:
      - 'tika-core/**'
      - '.github/workflows/tache2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tache2-${{ github.ref }}
  cancel-in-progress: true

env:
  MVN: ./mvnw -B -ntp
  TESTS_GENERES: org.apache.tika.io.EndianUtils_*_Test
  TESTS_MUTATION: org.apache.tika.io.EndianUtilsMutationTest
  TESTS_COUVERTURE: org.apache.tika.io.EndianUtilsCouvertureTest

jobs:
  tests-et-mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Installer le JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Compiler tika-core et exécuter tous ses tests
        run: $MVN -pl tika-core -am install

      - name: "Couverture JaCoCo d'EndianUtils (CSV et HTML), pour chacune des quatre suites"
        run: |
          mkdir -p rapports outils
          # jacococli fait un rapport HTML limité à EndianUtils à partir des données de l'agent JaCoCo.
          $MVN -N dependency:copy -Dartifact=org.jacoco:org.jacoco.cli:0.8.15:jar:nodeps -DoutputDirectory=outils
          echo "mesure,instructions_couvertes,instructions,branches_couvertes,branches,lignes_couvertes,lignes,methodes_couvertes,methodes" > rapports/couverture-jacoco.csv
          mesurer() {
            $MVN -pl tika-core test -Djacoco.append=false -Dtest="$2"
            python3 - "$1" >> rapports/couverture-jacoco.csv <<'PY'
          import csv, sys
          for r in csv.DictReader(open("tika-core/target/site/jacoco/jacoco.csv")):
              if r["PACKAGE"] == "org.apache.tika.io" and r["CLASS"] == "EndianUtils":
                  colonnes = [sys.argv[1]]
                  for k in ("INSTRUCTION", "BRANCH", "LINE", "METHOD"):
                      couvert = int(r[k + "_COVERED"])
                      colonnes += [str(couvert), str(couvert + int(r[k + "_MISSED"]))]
                  print(",".join(colonnes))
          PY
            java -jar outils/org.jacoco.cli-0.8.15-nodeps.jar report tika-core/target/jacoco.exec \
              --classfiles tika-core/target/classes/org/apache/tika/io/EndianUtils.class \
              --classfiles 'tika-core/target/classes/org/apache/tika/io/EndianUtils$BufferUnderrunException.class' \
              --sourcefiles tika-core/src/main/java --encoding UTF-8 \
              --name "EndianUtils - mesure $1" --html "rapports/jacoco-$1"
          }
          mesurer 1-tests-originaux "EndianUtilsTest"
          mesurer 2-avec-tests-generes "EndianUtilsTest,EndianUtils_*_Test"
          mesurer 3-avec-tests-manuels "EndianUtilsTest,EndianUtils_*_Test,EndianUtilsMutationTest"
          mesurer 4-avec-tests-de-couverture "EndianUtilsTest,EndianUtils_*_Test,EndianUtilsMutationTest,EndianUtilsCouvertureTest"
          cat rapports/couverture-jacoco.csv

      - name: "PIT 1/4 : tests d'origine"
        run: >
          $MVN -pl tika-core org.pitest:pitest-maven:mutationCoverage -DfullMutationMatrix=true
          -DexcludedTestClasses="$TESTS_GENERES,$TESTS_MUTATION,$TESTS_COUVERTURE"
          -DreportsDirectory="$GITHUB_WORKSPACE/rapports/pit-1-tests-originaux"

      - name: "PIT 2/4 : + tests générés par ChatUniTest"
        run: >
          $MVN -pl tika-core org.pitest:pitest-maven:mutationCoverage -DfullMutationMatrix=true
          -DexcludedTestClasses="$TESTS_MUTATION,$TESTS_COUVERTURE"
          -DreportsDirectory="$GITHUB_WORKSPACE/rapports/pit-2-avec-tests-generes"

      - name: "PIT 3/4 : + tests écrits à la main pour les mutants survivants"
        run: >
          $MVN -pl tika-core org.pitest:pitest-maven:mutationCoverage -DfullMutationMatrix=true
          -DexcludedTestClasses="$TESTS_COUVERTURE"
          -DreportsDirectory="$GITHUB_WORKSPACE/rapports/pit-3-avec-tests-manuels"

      - name: "PIT 4/4 : + tests écrits à la main pour le code non couvert"
        run: >
          $MVN -pl tika-core org.pitest:pitest-maven:mutationCoverage -DfullMutationMatrix=true
          -DreportsDirectory="$GITHUB_WORKSPACE/rapports/pit-4-avec-tests-de-couverture"

      - name: Résumé des résultats
        if: always()
        run: |
          python3 - <<'PY'
          import collections, csv, glob, os, re
          import xml.etree.ElementTree as ET

          resume = []


          def annoncer(titre, lignes):
              # Annotation affichée sur la page de l'exécution (et lisible par l'API « check runs »).
              message = "\n".join(lignes).replace("%", "%25").replace("\n", "%0A")
              print(f"::notice title={titre}::{message}")


          def pourcentage(n, total, arrondi=round):
              return f"{arrondi(100 * n / total)} %" if total else "-"


          # Tests : les rapports Surefire des classes EndianUtils viennent de la dernière mesure
          # JaCoCo, les autres de l'exécution complète.
          resume += ["## Tests de tika-core", "",
                     "| Classe de test | Tests | Échecs | Erreurs | Ignorés |", "|---|---|---|---|---|"]
          total = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          tests_endian = 0
          for f in sorted(glob.glob("tika-core/target/surefire-reports/TEST-*.xml")):
              s = ET.parse(f).getroot()
              for k in total:
                  total[k] += int(s.get(k, "0"))
              if s.get("name").startswith("org.apache.tika.io.EndianUtils"):
                  tests_endian += int(s.get("tests"))
                  resume.append(f"| {s.get('name').rsplit('.', 1)[-1]} | {s.get('tests')} | {s.get('failures')} |"
                                f" {s.get('errors')} | {s.get('skipped')} |")
          bilan = (f"{total['tests']} tests dans tika-core, dont {tests_endian} pour EndianUtils :"
                   f" {total['failures']} échecs, {total['errors']} erreurs, {total['skipped']} ignorés")
          resume += ["", bilan + "."]
          annoncer("Tests", [bilan])

          resume += ["", "## Couverture JaCoCo d'EndianUtils", "",
                     "| Suite de tests | Instructions | Branches | Lignes | Méthodes |", "|---|---|---|---|---|"]
          notes = []
          if os.path.exists("rapports/couverture-jacoco.csv"):
              for r in csv.DictReader(open("rapports/couverture-jacoco.csv")):
                  cellules = []
                  for k in ("instructions", "branches", "lignes", "methodes"):
                      n, t = int(r[k + "_couvertes"]), int(r[k])
                      # JaCoCo arrondit à l'entier inférieur : 100 % veut dire tout couvert.
                      cellules.append(f"{n}/{t} ({pourcentage(n, t, int)})")
                  resume.append(f"| {r['mesure']} | " + " | ".join(cellules) + " |")
                  notes.append(f"{r['mesure']} : instructions {cellules[0]}, branches {cellules[1]},"
                               f" lignes {cellules[2]}, méthodes {cellules[3]}")
          annoncer("Couverture JaCoCo d'EndianUtils", notes)

          resume += ["", "## Analyse de mutation d'EndianUtils (PIT)", "",
                     "| Suite de tests | Tués | Survivants | Non couverts | Score de mutation | Force des tests |",
                     "|---|---|---|---|---|---|"]
          notes, survivants = [], []
          for d in sorted(glob.glob("rapports/pit-*")):
              f = os.path.join(d, "mutations.xml")
              if not os.path.exists(f):
                  continue
              ms = list(ET.parse(f).getroot())
              tues = sum(m.get("detected") == "true" for m in ms)
              non_couverts = sum(m.get("status") == "NO_COVERAGE" for m in ms)
              survivants = [m for m in ms if m.get("status") == "SURVIVED"]
              score = f"{pourcentage(tues, len(ms))} ({tues}/{len(ms)})"
              force = pourcentage(tues, len(ms) - non_couverts)
              resume.append(f"| {os.path.basename(d)} | {tues} | {len(survivants)} | {non_couverts} | {score} | {force} |")
              notes.append(f"{os.path.basename(d)} : {tues} tués, {len(survivants)} survivants,"
                           f" {non_couverts} non couverts ; score {score}, force {force}")
          annoncer("Mutation PIT d'EndianUtils", notes)

          details = [f"ligne {m.findtext('lineNumber')}, {m.findtext('mutatedMethod')} : {m.findtext('description')}"
                     for m in survivants]
          resume += ["", "Mutants qui survivent à la dernière exécution :", ""] + [f"- {d}" for d in details]
          annoncer("Survivants de la dernière exécution PIT", details or ["aucun"])

          def rapport(nom):
              f = f"rapports/{nom}/mutations.xml"
              return list(ET.parse(f).getroot()) if os.path.exists(f) else []


          def tueurs(m):
              # Avec fullMutationMatrix, <killingTests> liste tous les tests qui tuent le mutant.
              res = set()
              for t in (m.findtext("killingTests") or m.findtext("killingTest") or "").split("|"):
                  if t:
                      methode = re.search(r"\[method:([^(\]]+)", t)
                      res.add(t.split(".[engine")[0].rsplit(".", 1)[-1] + "." + (methode.group(1) if methode else "?"))
              return res


          non_couverts = collections.Counter(m.findtext("mutatedMethod") for m in rapport("pit-3-avec-tests-manuels")
                                             if m.get("status") == "NO_COVERAGE")
          annoncer("Mutants non couverts à la mesure 3, par méthode",
                   [", ".join(f"{k} {v}" for k, v in sorted(non_couverts.items())) or "aucun"])

          resume += ["", "## Tests écrits à la main : mutants qu'ils sont seuls à tuer", ""]
          notes = []
          for nom, classe in (("pit-3-avec-tests-manuels", "EndianUtilsMutationTest"),
                              ("pit-4-avec-tests-de-couverture", "EndianUtilsCouvertureTest")):
              ms = rapport(nom)
              if not any(m.find("killingTests") is not None for m in ms):
                  notes.append(f"{nom} : matrice complète absente")
                  continue
              seuls = collections.Counter()
              for m in ms:
                  t = tueurs(m)
                  if len(t) == 1:
                      seuls.update(t)
              f = f"tika-core/target/surefire-reports/TEST-org.apache.tika.io.{classe}.xml"
              tests = [c.get("name").split("(")[0] for c in ET.parse(f).getroot().iter("testcase")] if os.path.exists(f) else []
              detail = ", ".join(f"{t} {seuls[classe + '.' + t]}" for t in tests)
              notes.append(f"{nom} ({classe}) : {detail}")
              resume.append(f"- {nom} ({classe}) : {detail}")
          annoncer("Mutants tués par un seul test écrit à la main", notes)

          annoncer("Mutants de getLongLE (mesure 4)",
                   [f"ligne {m.findtext('lineNumber')} : {m.findtext('description')} ({m.get('status')})"
                    for m in rapport("pit-4-avec-tests-de-couverture") if m.findtext("mutatedMethod") == "getLongLE"] or ["aucun"])

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as sortie:
              sortie.write("\n".join(resume) + "\n")
          PY

      - name: Téléverser les rapports (à copier dans le dossier tache2/ du dépôt)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tache2-rapports
          path: rapports/

      - name: Téléverser les traces (rapports Surefire et JaCoCo complets)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tache2-traces
          path: |
            tika-core/target/surefire-reports/TEST-org.apache.tika.io.EndianUtils*.xml
            tika-core/target/site/jacoco/
